name: ola-plus

# Lean pipeline for the fork: checks the new web UI, builds olad from this tree, runs the
# static-hosting unit tests, starts olad serving the built UI and exercises both the UI's
# API client and the /ui/ hosting against the real daemon. (The upstream "build" workflow
# does full distcheck/coverage runs and is much slower.)
on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'ui/**'
      - 'olad/**'
      - 'common/http/**'
      - 'include/ola/http/**'
      - '.github/workflows/ola-plus.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'olad/**'
      - 'common/http/**'
      - 'include/ola/http/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ola-plus-ui-dist
          path: ui/dist

  olad:
    name: olad + UI hosting + API contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # OLA derives its build name from git tags
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config bison flex ccache \
            libprotobuf-dev libprotoc-dev protobuf-compiler uuid-dev libmicrohttpd-dev libcppunit-dev \
            libncurses-dev zlib1g-dev libusb-1.0-0-dev libftdi-dev liblo-dev libavahi-client-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        run: |
          autoreconf -i
          ./configure --enable-unittests CC="ccache gcc" CXX="ccache g++" CPPFLAGS=-Wno-deprecated-declarations
      - name: Build olad
        run: make -j"$(nproc)"
      - name: Static hosting unit tests
        run: |
          make -j"$(nproc)" common/http/StaticFilesTester olad/UiStoreTester
          ./common/http/StaticFilesTester
          ./olad/UiStoreTester
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Start olad serving the UI
        run: |
          mkdir -p "$RUNNER_TEMP/olacfg"
          ./olad/olad --config-dir "$RUNNER_TEMP/olacfg" --log-level 3 --http-port 9090 \
            --http-data-dir "$GITHUB_WORKSPACE/olad/www" \
            --ui-dir "$GITHUB_WORKSPACE/ui/dist" \
            > "$RUNNER_TEMP/olad.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/json/server_stats && exit 0
            sleep 1
          done
          echo "olad did not come up"; cat "$RUNNER_TEMP/olad.log"; exit 1
      - name: UI hosting at /ui/
        run: bash ui/ci/smoke-ui-hosting.sh http://127.0.0.1:9090
      - name: UI API client vs real olad
        working-directory: ui
        env:
          OLA_URL: http://127.0.0.1:9090
        run: npx vitest run src/lib/api.integration.test.ts
      - name: UI documents survive an olad restart
        run: |
          # The integration test above left the ci-doc document at revision 2.
          pkill -f "olad --config-dir" || true
          sleep 2
          ./olad/olad --config-dir "$RUNNER_TEMP/olacfg" --log-level 3 --http-port 9090 \
            --http-data-dir "$GITHUB_WORKSPACE/olad/www" --ui-dir "$GITHUB_WORKSPACE/ui/dist" \
            >> "$RUNNER_TEMP/olad.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/json/server_stats >/dev/null && break
            sleep 1
          done
          doc=$(curl -sf "http://127.0.0.1:9090/json/ui_store?k=ci-doc")
          echo "$doc"
          echo "$doc" | jq -e '.rev == 2 and .data.second == true'
          ls "$RUNNER_TEMP/olacfg"
      - name: UI found next to the classic one, with no --ui-dir (as the package installs it)
        run: |
          pkill -f "olad --config-dir" || true
          sleep 2
          cp -r olad/www "$RUNNER_TEMP/www"
          cp -r ui/dist "$RUNNER_TEMP/www/ui"
          mkdir -p "$RUNNER_TEMP/olacfg2"
          ./olad/olad --config-dir "$RUNNER_TEMP/olacfg2" --log-level 3 --http-port 9090 --rpc-port 9011 \
            --http-data-dir "$RUNNER_TEMP/www" \
            >> "$RUNNER_TEMP/olad.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/json/server_stats >/dev/null && break
            sleep 1
          done
          bash ui/ci/smoke-ui-hosting.sh http://127.0.0.1:9090
      - name: olad log
        if: always()
        run: cat "$RUNNER_TEMP/olad.log" || true

  # Run by hand (workflow_dispatch) or when a v* tag is pushed: builds the ola-plus Debian package for amd64, arm64 and armhf (32-bit
  # Raspberry Pi OS) in a Debian trixie container, so library versions match what runs it.
  # amd64 and arm64 build natively (arm64 on GitHub's ARM runners); armhf is cross-compiled.
  # See packaging/deb/build-arch.sh, which is also how to reproduce a package locally.
  deb:
    name: deb (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { arch: armhf, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ola-plus-ui-dist
          path: ui-dist
      - name: Build the package
        run: bash packaging/deb/build-arch.sh ${{ matrix.arch }} ui-dist out
      - uses: actions/upload-artifact@v4
        with:
          name: ola-plus-deb-${{ matrix.arch }}
          path: out/*.deb

  # Same triggers: installs each package over the Debian ola package in a container of its own
  # architecture (native for amd64 and arm64, QEMU for armhf), runs olad from it, checks the
  # UI and API, and rolls back to ola.
  deb-test:
    name: deb-test (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, platform: linux/amd64, qemu: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, qemu: false }
          - { arch: armhf, runner: ubuntu-latest, platform: linux/arm/v7, qemu: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ola-plus-deb-${{ matrix.arch }}
          path: deb
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
        with:
          platforms: arm
      - name: Replace Debian ola with ola-plus, run it, roll back
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/work" -w /work debian:trixie             bash /work/packaging/deb/test-install.sh /work/deb /work

  # When a v* tag is pushed and every package built and installed, collect them under friendly
  # names (OlaPlus-v0.11.0-arm64.deb), add checksums and open a DRAFT release for review. A draft is
  # invisible to the public until someone presses Publish, so a tag can never publish by itself.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, deb-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ola-plus-deb-*
          merge-multiple: true
          path: debs
      - name: Collect the release files
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="OlaPlus-${TAG}"
          WANT="${TAG#v}"; WANT="${WANT/-rc/~rc}"   # v0.11.0-rc1 is Debian version 0.11.0~rc1
          mkdir out
          for f in debs/ola-plus_*.deb; do
            [ "$(dpkg-deb -f "$f" Version)" = "$WANT" ] || { echo "$f has version $(dpkg-deb -f "$f" Version), expected $WANT" >&2; exit 1; }
            arch=$(dpkg-deb -f "$f" Architecture)
            cp "$f" "out/${NAME}-${arch}.deb"
          done
          [ "$(ls out | wc -l)" = 3 ] || { echo "expected 3 packages, found:"; ls out; exit 1; }
          (cd out && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          sed -e "s/@TAG@/$TAG/g" -e "s/@NAME@/$NAME/g" packaging/release-notes.md > notes.md
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --draft $flags --verify-tag             --title "OLA Plus ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
