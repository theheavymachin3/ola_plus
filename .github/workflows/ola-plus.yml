name: ola-plus

# Lean pipeline for the fork: checks the new web UI, builds olad from this tree, runs the
# static-hosting unit tests, starts olad serving the built UI and exercises both the UI's
# API client and the /ui/ hosting against the real daemon. (The upstream "build" workflow
# does full distcheck/coverage runs and is much slower.)
on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'olad/**'
      - 'common/http/**'
      - 'include/ola/http/**'
      - '.github/workflows/ola-plus.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'olad/**'
      - 'common/http/**'
      - 'include/ola/http/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ola-plus-ui-dist
          path: ui/dist

  olad:
    name: olad + UI hosting + API contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # OLA derives its build name from git tags
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config bison flex ccache \
            libprotobuf-dev libprotoc-dev protobuf-compiler uuid-dev libmicrohttpd-dev libcppunit-dev \
            libncurses-dev zlib1g-dev libusb-1.0-0-dev libftdi-dev liblo-dev libavahi-client-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        run: |
          autoreconf -i
          ./configure --enable-unittests CC="ccache gcc" CXX="ccache g++" CPPFLAGS=-Wno-deprecated-declarations
      - name: Build olad
        run: make -j"$(nproc)"
      - name: Static hosting unit tests
        run: |
          make -j"$(nproc)" common/http/StaticFilesTester
          ./common/http/StaticFilesTester
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Start olad serving the UI
        run: |
          mkdir -p "$RUNNER_TEMP/olacfg"
          ./olad/olad --config-dir "$RUNNER_TEMP/olacfg" --log-level 3 --http-port 9090 \
            --http-data-dir "$GITHUB_WORKSPACE/olad/www" \
            --ui-dir "$GITHUB_WORKSPACE/ui/dist" \
            > "$RUNNER_TEMP/olad.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/json/server_stats && exit 0
            sleep 1
          done
          echo "olad did not come up"; cat "$RUNNER_TEMP/olad.log"; exit 1
      - name: UI hosting at /ui/
        run: bash ui/ci/smoke-ui-hosting.sh http://127.0.0.1:9090
      - name: UI API client vs real olad
        working-directory: ui
        env:
          OLA_URL: http://127.0.0.1:9090
        run: npx vitest run src/lib/api.integration.test.ts
      - name: olad log
        if: always()
        run: cat "$RUNNER_TEMP/olad.log" || true

  # Manual only: a 32-bit ARM (Raspberry Pi OS / Debian trixie) build of olad plus the UI,
  # to try on real hardware. Cross-compiled in a trixie container so library versions match
  # the Pi. The host-side ola_protoc_plugin is built natively and reused (OLA's own
  # cross-compile mechanism).
  olad-armhf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchains and libraries
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential crossbuild-essential-armhf autoconf automake libtool pkgconf bison flex ccache \
            protobuf-compiler libprotobuf-dev libprotoc-dev uuid-dev libmicrohttpd-dev libcppunit-dev \
            libprotobuf-dev:armhf uuid-dev:armhf libmicrohttpd-dev:armhf libcppunit-dev:armhf \
            libncurses-dev:armhf zlib1g-dev:armhf libusb-1.0-0-dev:armhf libftdi-dev:armhf \
            liblo-dev:armhf libavahi-client-dev:armhf
      - name: autoreconf
        run: autoreconf -i
      - name: Build the host ola_protoc_plugin
        run: |
          mkdir build-host && cd build-host
          ../configure CPPFLAGS=-Wno-deprecated-declarations
          make -j"$(nproc)" protoc/ola_protoc_plugin
      - name: Cross-configure for armhf
        run: |
          mkdir build-arm && cd build-arm
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          ../configure --host=arm-linux-gnueabihf \
            --with-ola-protoc-plugin="$GITHUB_WORKSPACE/build-host/protoc/ola_protoc_plugin" \
            CPPFLAGS=-Wno-deprecated-declarations
      - name: Cross-build and stage
        run: |
          cd build-arm
          make -j"$(nproc)"
          make install DESTDIR="$GITHUB_WORKSPACE/stage"
          cd "$GITHUB_WORKSPACE"
          tar -C stage -czf ola-plus-armhf.tar.gz .
          file stage/usr/local/bin/olad || true
      - uses: actions/upload-artifact@v4
        with:
          name: ola-plus-armhf
          path: ola-plus-armhf.tar.gz
